version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "semiannually"
    open-pull-requests-limit: 3
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-modules-major:
        patterns: ["*"]
        update-types: ["major"]
